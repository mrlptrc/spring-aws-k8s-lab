spring.application.name=notes-api

# Cada propriedade pode ser sobrescrita por variável de ambiente:
# app.dynamodb.endpoint -> APP_DYNAMODB_ENDPOINT (relaxed binding do Spring).
# É assim que o mesmo jar roda local, no Docker e no Kubernetes sem rebuild.
app.dynamodb.table=notes
app.dynamodb.region=us-east-1
# Vazio = endpoint real da AWS. Local/teste aponta para o DynamoDB Local.
app.dynamodb.endpoint=
# Só para ambiente local: na AWS a tabela é criada pelo Terraform.
app.dynamodb.create-table=false

# Actuator: expõe só o necessário.
# health -> probes do Kubernetes; prometheus -> métricas para scraping.
management.endpoints.web.exposure.include=health,info,prometheus
# Liga /actuator/health/liveness e /readiness também fora do Kubernetes.
management.endpoint.health.probes.enabled=true
